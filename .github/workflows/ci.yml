name: test
on: [push, pull_request]
jobs:
  build:
    name: ${{ matrix.os }} Ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu", "macos", "windows"]
        ruby: ["3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake test
      - name: Build source gem
        run: bundle exec rake build
      - name: Install and load source gem
        shell: bash
        env:
          GEM_HOME: ${{ runner.temp }}/ruby-minimap2-gems
          GEM_PATH: ${{ runner.temp }}/ruby-minimap2-gems
        run: |
          gem install --local pkg/minimap2-*.gem --no-document
          ruby -r minimap2 -e 'puts Minimap2::VERSION'
